name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.7"
          build-root-directory: AutoTradeSignal
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoTradeSignal-APK
          path: AutoTradeSignal/app/build/outputs/apk/debug/*.apk
